name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  sdist:
    # The source distribution must hold everything the tests need
    # (bulk_files, tests/data): build it, unpack it and test from there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist
        run: |
          python -m pip install -U pip build
          python -m build --sdist --outdir dist .

      - name: Install the sdist and run the tests from it
        run: |
          mkdir sdist-test
          tar -xzf dist/*.tar.gz -C sdist-test --strip-components=1
          cd sdist-test
          python -m pip install ".[dev]"
          pytest -q
