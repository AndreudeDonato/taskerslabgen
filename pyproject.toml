[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskerslabgen"
version = "0.3.1"
description = "Tasker I/II/III slab generation and cutting utilities for ASE."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Andreu A. de Donato" },
]
keywords = [
  "ase",
  "surfaces",
  "slabs",
  "tasker",
  "oxides",
  "materials",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "ase>=3.22",
  "numpy",
  "matplotlib",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/AndreudeDonato/taskerslabgen"
Repository = "https://github.com/AndreudeDonato/taskerslabgen"
Issues = "https://github.com/AndreudeDonato/taskerslabgen/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["taskerslabgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Surface upstream API deprecations (e.g. ASE) before they become errors.
filterwarnings = ["error::FutureWarning", "error:taskerslabgen\\.:DeprecationWarning"]
